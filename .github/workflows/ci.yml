name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Reduce CI matrix: only run 3.12 on ubuntu to save minutes
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,gui,mod-b,screen-audit]"

      - name: Install Playwright Browsers
        run: |
          pip install "playwright>=1.40.0"
          playwright install chromium --with-deps
        continue-on-error: true

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ -v --cov=src/aegisScout --cov-report=xml --cov-report=term-missing -W error::DeprecationWarning -W ignore::pytest.PytestUnraisableExceptionWarning
        continue-on-error: false
        env:
          # Prevent real API calls from tests
          GOOGLE_CUSTOM_SEARCH_API_KEY: ""
          INSTAGRAM_SESSIONID: ""

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
        continue-on-error: true

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy

      - name: Run Ruff (fast linter)
        run: ruff check src/ --select E,W,F --ignore E501,W503
        continue-on-error: true

      - name: Run Mypy (type check)
        run: mypy src/aegisScout --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  build:
    name: Build Windows Executable
    runs-on: windows-latest
    timeout-minutes: 25
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,gui,mod-b,screen-audit]"
          pip install pyinstaller pywebview bottle proxy_tools

      - name: Build Windows EXE
        run: |
          python scripts/build_exe.py --clean

      - name: Upload aegisScout Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegisScout-windows-exe
          path: dist/aegisScout.exe
          retention-days: 14
